<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/acceuil.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <title>NetflixLight - Séries</title>
</head>
<body>
    <header id="main-header"></header>

    <h3>Séries populaires</h3>
    <div class="swiper swiper-series series-swiper">
        <div class="swiper-wrapper" id="series-wrapper"></div>
    </div>

    <h3>Séries les mieux notées</h3>
    <div class="swiper swiper-series top-rated-series-swiper">
        <div class="swiper-wrapper" id="top-rated-series-wrapper"></div>
    </div>

    <h3>Séries d'action et d'aventure</h3>
    <div class="swiper swiper-series series-action-swiper">
        <div class="swiper-wrapper" id="series-action-wrapper"></div>
    </div>

    <h3>Séries science-fiction et fantasy</h3>
    <div class="swiper swiper-series series-sci-fi-swiper">
        <div class="swiper-wrapper" id="series-sci-fi-wrapper"></div>
    </div>

    <h3>Séries dramatiques</h3>
    <div class="swiper swiper-series series-drama-swiper">
        <div class="swiper-wrapper" id="series-drama-wrapper"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/static/script/animationHover.js"></script>
    <script src="/static/script/carrouselComponent.js"></script>

    <script type="module">
        import { initHeader, updateHeaderAuth } from '/static/js/header.js';
        import { startAuthSessionMonitor } from '/static/js/auth.js';

        initHeader();

        startAuthSessionMonitor({
            updateHeaderAuth,
            redirectToLogin: true,
        });

        document.addEventListener('nl:auth:logout', () => {
            window.location.href = '/logout';
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.loadCarousel({
                wrapperId: "series-wrapper",
                swiperSelector: ".series-swiper",
                endpoint: "/api/popular-series",
                fetchErrorMessage: "Impossible de charger les séries",
                emptyErrorMessage: "Aucune série reçue",
                fallbackMediaType: "tv"
            });

            window.loadCarousel({
                wrapperId: "top-rated-series-wrapper",
                swiperSelector: ".top-rated-series-swiper",
                endpoint: "/api/top-rated-series",
                fetchErrorMessage: "Impossible de charger les séries mieux notées",
                emptyErrorMessage: "Aucune série mieux notée reçue",
                fallbackMediaType: "tv",
                showRating: true
            });

            window.loadCarousel({
                wrapperId: "series-action-wrapper",
                swiperSelector: ".series-action-swiper",
                endpoint: "/discover/series-action-only",
                fetchErrorMessage: "Impossible de charger les séries d'action",
                emptyErrorMessage: "Aucune série d'action reçue",
                fallbackMediaType: "tv"
            });

            window.loadCarousel({
                wrapperId: "series-sci-fi-wrapper",
                swiperSelector: ".series-sci-fi-swiper",
                endpoint: "/discover/series-sci-fi-only",
                fetchErrorMessage: "Impossible de charger les séries science-fiction",
                emptyErrorMessage: "Aucune série science-fiction reçue",
                fallbackMediaType: "tv"
            });

            window.loadCarousel({
                wrapperId: "series-drama-wrapper",
                swiperSelector: ".series-drama-swiper",
                endpoint: "/discover/series-drama-only",
                fetchErrorMessage: "Impossible de charger les séries dramatiques",
                emptyErrorMessage: "Aucune série dramatique reçue",
                fallbackMediaType: "tv"
            });
        });
    </script>
</body>
</html>
