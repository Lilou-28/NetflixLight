<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/acceuil.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <title>NetflixLight - Films</title>
</head>
<body>
    <header id="main-header"></header>

    <h3>Films populaires</h3>
    <div class="swiper swiper-movies movies-swiper">
        <div class="swiper-wrapper" id="movies-wrapper"></div>
    </div>

    <h3>Films les mieux notés</h3>
    <div class="swiper swiper-series top-rated-movies-swiper">
        <div class="swiper-wrapper" id="top-rated-movies-wrapper"></div>
    </div>

    <h3>Film d'action</h3>
    <div class="swiper swiper-movies genre-action-swiper">
        <div class="swiper-wrapper" id="movie-action-wrapper"></div>
    </div>

    <h3>Film Fantasy</h3>
    <div class="swiper swiper-movies genre-fantasy-swiper">
        <div class="swiper-wrapper" id="movie-fantasy-wrapper"></div>
    </div>

    <h3>Films à suspense</h3>
    <div class="swiper swiper-movies thriller-swiper">
        <div class="swiper-wrapper" id="movie-thriller-wrapper"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/static/script/animationHover.js"></script>
    <script src="/static/script/carrouselComponent.js"></script>

    <script type="module">
        import { initHeader, updateHeaderAuth } from '/static/js/header.js';
        import { startAuthSessionMonitor } from '/static/js/auth.js';

        initHeader();

        startAuthSessionMonitor({
            updateHeaderAuth,
            redirectToLogin: true,
        });

        document.addEventListener('nl:auth:logout', () => {
            window.location.href = '/logout';
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.loadCarousel({
                wrapperId: "movies-wrapper",
                swiperSelector: ".movies-swiper",
                endpoint: "/api/popular-movies",
                fetchErrorMessage: "Impossible de charger les films",
                emptyErrorMessage: "Aucun film reçu",
                fallbackMediaType: "movie"
            });

            window.loadCarousel({
                wrapperId: "top-rated-movies-wrapper",
                swiperSelector: ".top-rated-movies-swiper",
                endpoint: "/api/top-rated-movies",
                fetchErrorMessage: "Impossible de charger les films mieux notés",
                emptyErrorMessage: "Aucun film mieux noté reçu",
                fallbackMediaType: "movie",
                showRating: true
            });

            window.loadCarousel({
                wrapperId: "movie-action-wrapper",
                swiperSelector: ".genre-action-swiper",
                endpoint: "/discover/movie-action-only",
                fetchErrorMessage: "Impossible de charger les films d'action",
                emptyErrorMessage: "Aucun film d'action reçu",
                fallbackMediaType: "movie"
            });

            window.loadCarousel({
                wrapperId: "movie-fantasy-wrapper",
                swiperSelector: ".genre-fantasy-swiper",
                endpoint: "/discover/movie-fantasy-only",
                fetchErrorMessage: "Impossible de charger les films fantasy",
                emptyErrorMessage: "Aucun film fantasy reçu",
                fallbackMediaType: "movie"
            });

            window.loadCarousel({
                wrapperId: "movie-thriller-wrapper",
                swiperSelector: ".thriller-swiper",
                endpoint: "/discover/movie-thriller-only",
                fetchErrorMessage: "Impossible de charger les films à suspense",
                emptyErrorMessage: "Aucun film à suspense reçu",
                fallbackMediaType: "movie"
            });
        });
    </script>
</body>
</html>
