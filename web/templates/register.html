<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/register.css">
    <link rel="stylesheet" href="/static/header.css">
    <title>Inscription</title>
</head>
<body>
    <header id="main-header"></header>

    <main class="hero">
        <h1>Inscription</h1>
        <p>Crée ton compte NetflixLight</p>
        <form method="POST" action="/register">
            <input type="text" name="name" placeholder="Nom complet" autocomplete="name" required>
            <input type="email" name="email" placeholder="Email" autocomplete="email" required>
            <input type="text" name="username" placeholder="Nom d'utilisateur" autocomplete="username" required>
            <input type="password" name="password" placeholder="Mot de passe" autocomplete="new-password" required>
            <input type="password" name="confirm_password" placeholder="Confirmer le mot de passe" autocomplete="new-password" required>
            <button type="submit">S'inscrire</button>
        </form>
    </main>

    <script type="module">
        import { initHeader, updateHeaderAuth } from '/static/js/header.js';

        initHeader();

        updateHeaderAuth({ isLoggedIn: false });
    </script>
</body>
</html>
