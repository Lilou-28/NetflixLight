<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/index.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
	<title>NetflixLight</title>
</head>
<body>
	
	<main class="hero">
		<h1>NetflixLight</h1>
		<p>Serveur Node.js actif, page HTML et CSS charges correctement.</p>
		<button type="button" onclick="window.location.href='/details'">Voir page detail</button>
		<button type="button" onclick="window.location.href='/login'">Login</button>
		<button type="button" onclick="window.location.href='/register'">Register</button>
		<button type="button" id="logout-btn" onclick="window.location.href='/logout'">Logout</button>
	</main>
	<h3>Films populaires</h3>
	<div class="swiper swiper-movies movies-swiper">
		<div class="swiper-wrapper" id="movies-wrapper"></div>
	</div>
	<h3>Séries populaires</h3>
	<div class="swiper swiper-series series-swiper">
		<div class="swiper-wrapper" id="series-wrapper"></div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	<script src="../static/carrouselle.js"></script>
	<script src="../static/carouselleSeries.js"></script>
	<script src="../static/logout.js"></script>
</body>
</html>
