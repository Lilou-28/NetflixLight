<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../static/img/Logo-onglet-nl.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/acceuil.css">
    <link rel="stylesheet" href="../static/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <title>NetflixLight</title>
</head>
<body>
    <header id="main-header"></header>

    <section class="hero-banner" id="hero-banner" aria-label="Film mis en avant">
        <div class="hero-banner__overlay"></div>
        <div class="hero-banner__content">
            <h1 id="hero-title">Chargement...</h1>
            <p id="hero-overview">Nous préparons une recommandation pour vous.</p>
            <div class="hero-banner__actions">
                <button type="button" id="hero-details-btn">Voir les détails</button>
            </div>
        </div>
    </section>
    <h3>Films et series tendance</h3>
    <div class="swiper swiper-movies trending-mixed-swiper">
        <div class="swiper-wrapper" id="trending-mixed-wrapper"></div>
	</div>
    <h3>Film et series les plus populaires</h3>
    <div class="swiper swiper-movies popular-mixed-swiper">
        <div class="swiper-wrapper" id="popular-mixed-wrapper"></div>
	</div>
        <h3>Films et series les mieux notés</h3>
        <div class="swiper swiper-series top-rated-mixed-swiper">
		<div class="swiper-wrapper" id="top-rated-mixed-wrapper"></div>
	</div>
    <h3>Film et series d'action</h3>
    <div class="swiper swiper-movies genre-action-swiper">
		<div class="swiper-wrapper" id="movie-action-wrapper"></div>
	</div>
    <h3>Film et series de fantasy</h3>
    <div class="swiper swiper-movies genre-fantasy-swiper">
		<div class="swiper-wrapper" id="movie-fantasy-wrapper"></div>
	</div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/static/script/animationHover.js"></script>
	<script src="/static/script/carrouselComponent.js"></script>
	<script src="/static/script/heroBanner.js"></script>

    <script type="module">
    import { initHeader, updateHeaderAuth } from '/static/js/header.js';
    import { startAuthSessionMonitor } from '/static/js/auth.js';

    initHeader();

    startAuthSessionMonitor({
        updateHeaderAuth,
        redirectToLogin: true,
    });

    document.addEventListener('nl:auth:logout', () => {
        window.location.href = '/logout';
    });
</script>
</body>
</html>
