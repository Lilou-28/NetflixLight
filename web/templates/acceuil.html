<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/acceuil.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <title>NetflixLight</title>
</head>
<body>
    <div class="search-container">
        <form id="search-form">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Rechercher un film..." 
                autocomplete="off"
            >
            <button type="submit" id="search-button">
                <span>🔍</span>
            </button>
        </form>
    </div>
    <section class="hero-banner" id="hero-banner" aria-label="Film mis en avant">
        <div class="hero-banner__overlay"></div>
        <div class="hero-banner__content">
            <h1 id="hero-title">Chargement...</h1>
            <p id="hero-overview">Nous préparons une recommandation pour vous.</p>
            <div class="hero-banner__actions">
                <button type="button" id="hero-details-btn">Voir les détails</button>
            </div>
        </div>
    </section>
    <h3>Films tendance de la semaine</h3>
    <div class="swiper swiper-movies week trending-week-swiper">
        <div class="swiper-wrapper" id="trending-week-wrapper"></div>
	</div>
    <h3>Films tendance de la journée</h3>
    <div class="swiper swiper-movies day trending-day-swiper">
        <div class="swiper-wrapper" id="trending-day-wrapper"></div>
	</div>
    <h3>Films populaires</h3>
    <div class="swiper swiper-movies popular-movies-swiper">
        <div class="swiper-wrapper" id="popular-movies-wrapper"></div>
	</div>
	<h3>Séries populaires</h3>
	<div class="swiper swiper-series series-swiper">
		<div class="swiper-wrapper" id="series-wrapper"></div>
	</div>
    <h3>Films les mieux notés</h3>
    <div class="swiper swiper-series top-rated-movies-swiper">
		<div class="swiper-wrapper" id="top-rated-movies-wrapper"></div>
	</div>
    <h3>Séries les mieux notées</h3>
    <div class="swiper swiper-series top-rated-series-swiper">
		<div class="swiper-wrapper" id="top-rated-series-wrapper"></div>
	</div>
    <h3>Film d'action</h3>
    <div class="swiper swiper-movies genre-action-swiper">
		<div class="swiper-wrapper" id="movie-action-wrapper"></div>
	</div>
    <h3>Film Fantasy</h3>
    <div class="swiper swiper-movies genre-fantasy-swiper">
		<div class="swiper-wrapper" id="movie-fantasy-wrapper"></div>
	</div>
    <button type="button" id="logout-btn" onclick="window.location.href='/logout'">Logout</button>
    <button type="button" onclick="window.location.href='/'"><- retour </button>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="../static/script/heroBanner.js"></script>
    <script src="../static/script/carrouselTendanceWeek.js"></script>
    <script src="../static/script/carrouselTendanceDay.js"></script>
	<script src="../static/script/carrouselMovies.js"></script>
	<script src="../static/script/carrouselSeries.js"></script>
    <script src="../static/script/carrouselTopRatedMovies.js"></script>
    <script src="../static/script/carrouselTopRatedTv.js"></script>
    <script src="../static/script/carrouselGenreAction.js"></script>
    <script src="../static/script/carrouselGenreFantasy.js"></script>
    <script src="../static/script/searchbar.js"></script>
</body>
</html>
