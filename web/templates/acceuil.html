<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/acceuil.css">
    <link rel="stylesheet" href="../static/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <title>NetflixLight</title>
</head>
<body>
    <header id="main-header"></header>

    <h3>Films populaires</h3>
	<div class="swiper swiper-movies movies-swiper">
		<div class="swiper-wrapper" id="movies-wrapper"></div>
	</div>
	<h3>Séries populaires</h3>
	<div class="swiper swiper-series series-swiper">
		<div class="swiper-wrapper" id="series-wrapper"></div>
	</div>
    <h3>Film et series les plus populaires</h3>
    <div class="swiper swiper-movies popular-mixed-swiper">
        <div class="swiper-wrapper" id="popular-mixed-wrapper"></div>
	</div>
        <h3>Films et series les mieux notés</h3>
        <div class="swiper swiper-series top-rated-mixed-swiper">
		<div class="swiper-wrapper" id="top-rated-mixed-wrapper"></div>
	</div>
    <h3>Film d'action</h3>
    <div class="swiper swiper-movies genre-action-swiper">
		<div class="swiper-wrapper" id="movie-action-wrapper"></div>
	</div>
    <h3>Film Fantasy</h3>
    <div class="swiper swiper-movies genre-fantasy-swiper">
		<div class="swiper-wrapper" id="movie-fantasy-wrapper"></div>
	</div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	<script src="../static/script/carrouselMovies.js"></script>
	<script src="../static/script/carrouselSeries.js"></script>
    <script src="../static/script/carrouselTopRatedMovies.js"></script>
    <script src="../static/script/carrouselTopRatedTv.js"></script>
    <script src="../static/script/carrouselGenreAction.js"></script>
    <script src="../static/script/carrouselGenreFantasy.js"></script>

    <script type="module">
    import { initHeader, updateHeaderAuth } from '/static/js/header.js';

    initHeader();

    fetch("/api/userinfo", { method: "GET" })
    .then((res) => {
        if (!res.ok) throw new Error("Non connecté");
        return res.json();
    })
    .then((data) => {
        localStorage.setItem('nl_user', JSON.stringify({ username: data.username }));
        updateHeaderAuth({ isLoggedIn: true, username: data.username });
    })
    .catch(() => {
        localStorage.removeItem('nl_user');
        updateHeaderAuth({ isLoggedIn: false });
    });

    document.addEventListener('nl:auth:logout', () => {
        localStorage.removeItem('nl_user');
        window.location.href = '/logout';
    });
</script>
</body>
</html>
