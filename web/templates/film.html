<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/film.css">
    <link rel="stylesheet" href="../static/header.css">
    <title>NetflixLight</title>
</head>
<body>
    <header id="main-header"></header>

    <main>
        <h1>{{ film.title }}</h1>
        <p><strong>Genre:</strong> {{ film.genre }}</p>
        <p><strong>Release Date:</strong> {{ film.release_date }}</p>
        <p><strong>Description:</strong> {{ film.description }}</p>
    </main>

    <script type="module">
        import { initHeader, updateHeaderAuth } from '../static/js/header.js';

        initHeader();

        const user = JSON.parse(localStorage.getItem('nl_user') || 'null');
        updateHeaderAuth({ isLoggedIn: !!user, username: user?.username ?? 'U' });

        document.addEventListener('nl:auth:logout', () => {
            window.location.href = '/logout';
        });
    </script>
</body>
</html>
