<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test Token</title>
	<style>
		body {
			margin: 0;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(120deg, #111827, #1f2937);
			color: #f9fafb;
			min-height: 100vh;
			display: grid;
			place-items: center;
		}

		.card {
			width: min(760px, 92vw);
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 255, 255, 0.18);
			border-radius: 16px;
			padding: 24px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
			backdrop-filter: blur(6px);
		}

		h1 { margin-top: 0; }

		button {
			border: none;
			background: #22c55e;
			color: #0b1020;
			font-weight: 700;
			padding: 10px 14px;
			border-radius: 10px;
			cursor: pointer;
			margin-right: 8px;
		}

		button.secondary {
			background: #e5e7eb;
		}

		#status {
			margin-top: 16px;
			font-weight: 700;
		}

		.ok { color: #4ade80; }
		.ko { color: #fca5a5; }

		pre {
			margin-top: 14px;
			background: #0f172a;
			color: #e2e8f0;
			border-radius: 10px;
			padding: 12px;
			overflow: auto;
			max-height: 320px;
		}
	</style>
</head>
<body>
	<section class="card">
		<h1>Verification du token</h1>
		<p>Cette page appelle <strong>/api/popular</strong>. Si la reponse contient des films, ton token fonctionne.</p>
		<button id="testBtn">Tester maintenant</button>
		<button class="secondary" onclick="window.location.href='/'">Retour accueil</button>

		<div id="status">En attente du test...</div>
		<pre id="output">Aucune reponse pour le moment.</pre>
	</section>

	<script>
		const statusEl = document.getElementById("status")
		const outputEl = document.getElementById("output")
		const testBtn = document.getElementById("testBtn")
		const params = new URLSearchParams(window.location.search)
		const tokenFromUrl = params.get("token")

		if (tokenFromUrl) {
			localStorage.setItem("session_token", tokenFromUrl)
			statusEl.className = "ok"
			statusEl.textContent = "Token stocke dans localStorage."
			outputEl.textContent = `Token: ${tokenFromUrl}`
		}

		async function testToken() {
			statusEl.className = ""
			statusEl.textContent = "Test en cours..."
			outputEl.textContent = "Chargement..."

			try {
				const response = await fetch("/api/popular")
				const data = await response.json()

				if (!response.ok) {
					statusEl.className = "ko"
					statusEl.textContent = "Echec: token absent ou invalide."
					outputEl.textContent = JSON.stringify(data, null, 2)
					return
				}

				const count = Array.isArray(data.results) ? data.results.length : 0

				if (count > 0) {
					statusEl.className = "ok"
					statusEl.textContent = `Succes: token valide (${count} films recuperes).`
				} else {
					statusEl.className = "ko"
					statusEl.textContent = "Reponse recue, mais sans films."
				}

				outputEl.textContent = JSON.stringify(data, null, 2)
			} catch (error) {
				statusEl.className = "ko"
				statusEl.textContent = "Erreur reseau pendant le test."
				outputEl.textContent = error.message
			}
		}

		testBtn.addEventListener("click", testToken)
	</script>
</body>
</html>
