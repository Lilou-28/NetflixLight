<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/login.css">
    <link rel="stylesheet" href="/static/header.css">
	<link rel="icon" href="../static/img/Logo-onglet-nl.png" type="image/png">
	<title>NetflixLight</title>
</head>
<body>
	<header id="main-header"></header>

	<main class="hero">
		<h1>Login</h1>
		<p>Pages Login</p>
        <form method="POST" action="/login">
            <input name="username" placeholder="username">
            <input type="password" name="password" placeholder="password">
            <button type="submit">Login</button>
        </form>
	</main>

	<script type="module">
		import { initHeader } from '/static/js/header.js';
		import { showSessionExpiredPopup } from '/static/js/auth.js';

		initHeader();

		const params = new URLSearchParams(window.location.search);
		if (params.get('session_expired') === '1') {
			showSessionExpiredPopup('/login');
		}
	</script>
</body>
</html>
