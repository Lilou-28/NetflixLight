<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/detail.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <title>NetflixLight - details</title>
</head>
<body class="detail-page-body">
    <header id="main-header"></header>

    <main class="detail-page">
        <section class="detail-hero" aria-label="Bannière du film">
            <img class="detail-hero__bg" src="{{backdrop_path}}" alt="Banner du film" />
            <div class="detail-hero__overlay"></div>

            
        </section>

        <section class="detail-content" aria-label="Informations du titre">
            <div class="detail-content__inner">
                <div class="detail-content__lead">
                    <img class="detail-poster" src="{{poster}}" alt="Affiche du film" />

                    <div class="detail-content__intro">
                        <h2>Informations</h2>
                        <div class="detail-hero__content">
                        <h1>{{title}}</h1>
                        <div class="hero-actions">
                            <button id="favori-btn" class="favori-btn">♡ Ajouter aux favoris</button>
                        </div>
                    </div>
                        <p class="detail-content__summary">{{overview}}</p>
                        <div class="detail-content__facts">
                            <p><strong>Genres :</strong> {{genres}}</p>
                            <p><strong>Date de sortie :</strong> {{release_date}}</p>
                            <p><strong>Note :</strong> {{vote_average}} ({{vote_count}} avis)</p>
                            <p><strong>{{runtime_label}} :</strong> {{runtime}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="cast-section" aria-labelledby="cast-title">
            <h2 id="cast-title">Casting</h2>
            <div class="cast-grid">
                {{cast_cards}}
            </div>
        </section>

        <section class="trailer-section" aria-labelledby="trailer-title">
            <h2 id="trailer-title">Bande d'annonce</h2>
            {{trailer_block}}
        </section>

        <section class="detail-similar">
            <h3>Films similaires</h3>
            <div class="swiper swiper-movies similar-swiper">
                <div class="swiper-wrapper" id="similar-wrapper"></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/static/script/animationHover.js"></script>
    <script src="/static/script/carrouselComponent.js"></script>
    <script src="/static/script/favoris.js"></script>
    <script src="/static/script/gestionSon.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        import { initHeader, updateHeaderAuth } from '/static/js/header.js';
        import { startAuthSessionMonitor } from '/static/js/auth.js';

        initHeader();

        startAuthSessionMonitor({
            updateHeaderAuth,
            redirectToLogin: true,
        });

        document.addEventListener('nl:auth:logout', () => {
            window.location.href = '/logout';
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const mediaId = params.get("id");
            const mediaType = params.get("type") || "movie";
            const title = document.querySelector("h1")?.textContent || "";
            const poster = document.querySelector(".detail-poster")?.src || "";

            const btn = document.getElementById("favori-btn");
            if (!btn || !mediaId) return;

            const already = await window.isFavori(mediaId);
            if (already) {
                btn.textContent = "♥ Retirer des favoris";
                btn.classList.add("favori--active");
            }

            btn.addEventListener("click", () => {
                window.toggleFavori(mediaId, mediaType, title, poster, btn);
            });
        });
    </script>
</body>
</html>
