<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/detail.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
	<title>NetflixLight - details </title>
</head>
<body>
	<main class="hero">
		<img src="{{backdrop_path}}" alt="Banner du film" />
		<h1>{{title}}</h1>
		<img src="{{poster}}" alt="Affiche du film" />
		<p>{{overview}}</p>
		<p>Genres : {{genres}}</p>
		<p>Date de sortie : {{release_date}}</p>
		<p>Note : {{vote_average}} ({{vote_count}} avis)</p>
		<p>{{runtime_label}} : {{runtime}}</p>
		<p>Casting : {{cast}}</p>
		<section class="cast-section" aria-labelledby="cast-title">
			<h2 id="cast-title">Acteurs</h2>
			<div class="cast-grid">
				{{cast_cards}}
			</div>
		</section>
		<h3>Film Similaire</h3>
		<div class="swiper swiper-movies similar-swiper">
			<div class="swiper-wrapper" id="similar-wrapper"></div>
		</div>
		<h3>Bande annonce</h3>
		<section class="trailer-section" aria-label="Lecteur de bande annonce">
			{{trailer_block}}
		</section>
		<button type="button" onclick="window.location.href='/acceuil'">Retour accueil</button>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	<script src="../static/script/carrouselComponent.js"></script>
	<script src="../static/script/gestionSon.js"></script>
	<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
