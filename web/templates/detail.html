<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/detail.css">
	<title>NetflixLight - details </title>
</head>
<body>
	<main class="hero">
		<img src="{{backdrop_path}}" alt="Banner du film" />
		<h1>{{title}}</h1>
		<img src="{{poster}}" alt="Affiche du film" />
		<p>{{overview}}</p>
		<p>Genres : {{genres}}</p>
		<p>Date de sortie : {{release_date}}</p>
		<p>Note : {{vote_average}} ({{vote_count}} avis)</p>
		<p>{{runtime_label}} : {{runtime}}</p>
		<p>Casting : {{cast}}</p>
		<button type="button" onclick="window.location.href='/acceuil'">Retour accueil</button>
	</main>
</body>
</html>
