<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/detail.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <title>NetflixLight - details</title>
</head>
<body>
    <header id="main-header"></header>

    <main class="hero">
        <img src="{{backdrop_path}}" alt="Banner du film" />
        <h1>{{title}}</h1>
        <img src="{{poster}}" alt="Affiche du film" />
        <p>{{overview}}</p>
        <p>Genres : {{genres}}</p>
        <p>Date de sortie : {{release_date}}</p>
        <p>Note : {{vote_average}} ({{vote_count}} avis)</p>
        <p>{{runtime_label}} : {{runtime}}</p>
        <p>Casting : {{cast}}</p>

        <button id="favori-btn" class="favori-btn">♡ Ajouter aux favoris</button>

        <section class="cast-section" aria-labelledby="cast-title">
            <h2 id="cast-title">Acteurs</h2>
            <div class="cast-grid">
                {{cast_cards}}
            </div>
        </section>
        <h3>Films similaires</h3>
        <div class="swiper swiper-movies similar-swiper">
            <div class="swiper-wrapper" id="similar-wrapper"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/static/script/carrouselComponent.js"></script>
    <script src="/static/script/favoris.js"></script>
    <script type="module">
        import { initHeader, updateHeaderAuth } from '/static/js/header.js';

        initHeader();

        fetch("/api/userinfo", { method: "GET" })
        .then((res) => {
            if (!res.ok) throw new Error("Non connecté");
            return res.json();
        })
        .then((data) => {
            localStorage.setItem('nl_user', JSON.stringify({ username: data.username }));
            updateHeaderAuth({ isLoggedIn: true, username: data.username });
        })
        .catch(() => {
            localStorage.removeItem('nl_user');
            updateHeaderAuth({ isLoggedIn: false });
        });

        document.addEventListener('nl:auth:logout', () => {
            localStorage.removeItem('nl_user');
            window.location.href = '/logout';
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const mediaId = params.get("id");
            const mediaType = params.get("type") || "movie";
            const title = document.querySelector("h1")?.textContent || "";
            const poster = document.querySelector("img:nth-child(3)")?.src || "";

            const btn = document.getElementById("favori-btn");
            if (!btn || !mediaId) return;

            const already = await window.isFavori(mediaId);
            if (already) {
                btn.textContent = "♥ Retirer des favoris";
                btn.classList.add("favori--active");
            }

            btn.addEventListener("click", () => {
                window.toggleFavori(mediaId, mediaType, title, poster, btn);
            });
        });
    </script>
</body>
</html>
