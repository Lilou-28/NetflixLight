<html lang="fr">

	<title>404 - Page non trouvée</title>

	<main class="error-container">

			<div class="error-actions">
				<a href="/acceuil" class="error-btn error-btn--primary">Retour à l'accueil</a>
				<a href="/films" class="error-btn error-btn--secondary">Découvrir des films</a>
			</div>
		</div>
	</main>

	<script type="module">
		import { initHeader } from '/static/js/header.js';
		initHeader();
	</script>
