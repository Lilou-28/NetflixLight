<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/userinfo.css">
    <link rel="stylesheet" href="/static/header.css">
    <title>NetflixLight - User Info</title>
</head>
<body>
    <header id="main-header"></header>

    <main class="profile-page">
        <section class="profile-card" aria-label="Informations du profil">
            <div class="profile-avatar" id="profile-avatar">U</div>
            <div class="profile-content">
                <p class="profile-eyebrow">Mon espace</p>
                <h1>Mon profil</h1>
                <div class="profile-grid">
                    <p><span>Nom</span><strong id="name">...</strong></p>
                    <p><span>Username</span><strong id="username">...</strong></p>
                    <p><span>Email</span><strong id="email">...</strong></p>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initHeader, updateHeaderAuth } from '/static/js/header.js';
        import { startAuthSessionMonitor } from '/static/js/auth.js';

        initHeader();

        startAuthSessionMonitor({
            updateHeaderAuth,
            redirectToLogin: true,
            onAuthenticated: (data) => {
                document.getElementById("name").textContent = data.name || "-";
                document.getElementById("username").textContent = data.username || "-";
                document.getElementById("email").textContent = data.email || "-";

                const avatar = document.getElementById("profile-avatar");
                if (avatar) {
                    const letter = (data.username || data.name || "U").charAt(0).toUpperCase();
                    avatar.textContent = letter;
                }
            },
        });

        document.addEventListener('nl:auth:logout', () => {
            window.location.href = '/logout';
        });
    </script>
</body>
</html>
