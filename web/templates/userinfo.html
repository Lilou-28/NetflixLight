<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/userinfo.css">
    <title>NetflixLight - User Info</title>
</head>
<body>
    <main class="hero">
        <h1>NetflixLight</h1>
    <p>Profil connecte:</p>
    <p>Nom: <strong id="name">...</strong></p>
    <p>Username: <strong id="username">...</strong></p>
    <p>Email: <strong id="email">...</strong></p>
        <button type="button" onclick="window.location.href='/'">Retour accueil</button>
    </main>
    <script>
        fetch("/api/userinfo", { method: "GET" })
        .then((res) => {
            if (!res.ok) {
            throw new Error("Session invalide ou non connectee")
            }
            return res.json()
        })
        .then((data) => {
            document.getElementById("name").textContent = data.name || "-"
            document.getElementById("username").textContent = data.username || "-"
            document.getElementById("email").textContent = data.email || "-"
        })
        .catch((err) => {
            console.error(err)
            window.location.href = "/login"
        })
    </script>
</body>
</html>
